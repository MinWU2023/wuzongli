name: Mobile Android APK

# 不使用 Expo EAS 云端，不需要 EXPO_TOKEN。
# Runner 上: expo prebuild → Gradle 打 APK → 上传到 Actions Artifacts。

on:
  workflow_dispatch:
    inputs:
      variant:
        description: APK variant
        required: true
        default: release
        type: choice
        options:
          - release
          - debug
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-android.yml'

concurrency:
  group: mobile-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve variant
        id: variant
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.variant }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=release" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # GitHub ubuntu runner 自带 Android SDK；勿用会安装已废弃 tools 包的 setup-android
      - name: Setup Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          {
            echo "$SDK_ROOT/cmdline-tools/latest/bin"
            echo "$SDK_ROOT/platform-tools"
            echo "$SDK_ROOT/emulator"
          } >> "$GITHUB_PATH"
          SDKMANAGER=""
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT"
            ls -la "$SDK_ROOT" || true
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install JS dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Prebuild native Android project
        run: npx expo prebuild --platform android --non-interactive

      # 内测直接打 debug 包，避免 release 签名配置在不同 Expo 模板下不一致
      - name: Gradle assemble
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          if [ "${{ steps.variant.outputs.name }}" = "release" ]; then
            ./gradlew assembleRelease --no-daemon || ./gradlew assembleDebug --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          VARIANT="${{ steps.variant.outputs.name }}"
          APK=$(find android/app/build/outputs/apk -type f -name "*.apk" ! -name "*.apk.idsig" | head -n 1)
          if [ -z "$APK" ]; then
            echo "APK not found"
            find android/app/build/outputs -type f -name "*.apk" || true
            exit 1
          fi
          echo "found=$APK"
          cp "$APK" "haoxiansuo-1.0.0-${VARIANT}.apk"
          echo "path=haoxiansuo-1.0.0-${VARIANT}.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: haoxiansuo-apk-${{ steps.variant.outputs.name }}
          path: mobile/haoxiansuo-1.0.0-${{ steps.variant.outputs.name }}.apk
          if-no-files-found: error

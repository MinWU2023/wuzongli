name: Mobile Android APK

# 不使用 Expo EAS。Runner 上 prebuild + Gradle 打 APK。
# - 普通推送 / 手动：上传到 Actions Artifacts
# - 打 v* 标签：额外创建/更新 GitHub Release，并把 APK 挂到 Assets

on:
  workflow_dispatch:
    inputs:
      variant:
        description: APK variant
        required: true
        default: release
        type: choice
        options:
          - release
          - debug
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master

permissions:
  contents: write

concurrency:
  group: mobile-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve variant
        id: variant
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.variant }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=release" >> "$GITHUB_OUTPUT"
          fi
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=1.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          {
            echo "$SDK_ROOT/cmdline-tools/latest/bin"
            echo "$SDK_ROOT/platform-tools"
            echo "$SDK_ROOT/emulator"
          } >> "$GITHUB_PATH"
          SDKMANAGER=""
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT"
            ls -la "$SDK_ROOT" || true
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install JS dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Prebuild native Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Gradle assemble
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          # release 无正式签名时回退 debug，保证能产出可安装 APK
          if [ "${{ steps.variant.outputs.name }}" = "release" ]; then
            ./gradlew assembleRelease --no-daemon || ./gradlew assembleDebug --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          VARIANT="${{ steps.variant.outputs.name }}"
          VERSION="${{ steps.variant.outputs.version }}"
          APK=$(find android/app/build/outputs/apk -type f -name "*.apk" ! -name "*.apk.idsig" | head -n 1)
          if [ -z "$APK" ]; then
            echo "APK not found"
            find android/app/build/outputs -type f -name "*.apk" || true
            exit 1
          fi
          OUT="haoxiansuo-${VERSION}-${VARIANT}.apk"
          cp "$APK" "$OUT"
          echo "found=$APK"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: haoxiansuo-apk-${{ steps.variant.outputs.version }}-${{ steps.variant.outputs.name }}
          path: mobile/${{ steps.apk.outputs.file }}
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 好线索 ${{ github.ref_name }}
          body: |
            好线索 ${{ github.ref_name }}

            下载下方 APK 安装。若只有源码压缩包，说明构建未成功，请到 Actions 查看日志。
          files: mobile/${{ steps.apk.outputs.file }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Mobile Android APK

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-android.yml'

concurrency:
  group: mobile-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve profile
        id: profile
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.profile }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "name=production" >> "$GITHUB_OUTPUT"
          else
            echo "name=preview" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # 全部装在 GitHub Runner 上，本机无需安装 eas-cli / node 依赖
      - name: Install EAS CLI (on runner)
        run: npm install -g eas-cli@latest

      - name: Install app dependencies (on runner)
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Check Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "${EXPO_TOKEN}" ]; then
            echo "在 GitHub → Settings → Secrets → Actions 添加 EXPO_TOKEN（expo.dev Access Token）"
            exit 1
          fi
          eas whoami

      - name: Verify EAS projectId
        shell: bash
        run: |
          if ! grep -Eq '"projectId"[[:space:]]*:[[:space:]]*"[0-9a-fA-F-]{36}"' app.json; then
            echo "mobile/app.json 缺少有效 extra.eas.projectId"
            exit 1
          fi

      - name: EAS Build (Android APK)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile ${{ steps.profile.outputs.name }} --non-interactive --wait

      - name: Print build result tip
        run: echo "到 https://expo.dev 下载 APK"

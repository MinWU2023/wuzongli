name: Mobile Android APK

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production
  # Tag v* → production；推 main/master 且改了 mobile 也可手动再跑
  push:
    tags:
      - 'v*'

concurrency:
  group: mobile-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve profile
        id: profile
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.profile }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "name=production" >> "$GITHUB_OUTPUT"
          else
            echo "name=preview" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Expo / EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Verify EAS projectId
        shell: bash
        run: |
          if grep -q 'REPLACE_WITH_EAS_PROJECT_ID' app.json; then
            echo "请先在本机执行: cd mobile && eas init，把 app.json 里的 projectId 写好再推送。"
            exit 1
          fi
          if ! grep -Eq '"projectId"[[:space:]]*:[[:space:]]*"[0-9a-fA-F-]{36}"' app.json; then
            echo "app.json 缺少有效的 extra.eas.projectId（UUID）。请先: cd mobile && eas init"
            exit 1
          fi

      - name: EAS Build (Android APK)
        run: eas build --platform android --profile ${{ steps.profile.outputs.name }} --non-interactive --wait

      - name: Print build result tip
        run: |
          echo "构建完成。请到 https://expo.dev 下载 APK，或执行: eas build:list --platform android"

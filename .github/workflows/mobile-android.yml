name: Mobile Android APK

# 不使用 Expo EAS 云端，不需要 EXPO_TOKEN。
# Runner 上: expo prebuild → Gradle 打 APK → 上传到 Actions Artifacts。

on:
  workflow_dispatch:
    inputs:
      variant:
        description: APK variant
        required: true
        default: release
        type: choice
        options:
          - release
          - debug
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-android.yml'

concurrency:
  group: mobile-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve variant
        id: variant
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.variant }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=release" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install JS dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Prebuild native Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Create CI signing keystore
        if: steps.variant.outputs.name == 'release'
        working-directory: mobile/android/app
        run: |
          keytool -genkeypair -v \
            -storetype PKCS12 \
            -keystore haoxiansuo-ci.keystore \
            -alias haoxiansuo \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass haoxiansuo -keypass haoxiansuo \
            -dname "CN=Haoxiansuo,OU=CI,O=YZZ,L=Wuhan,C=CN"

      - name: Wire release signing
        if: steps.variant.outputs.name == 'release'
        working-directory: mobile/android/app
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path("build.gradle")
          text = path.read_text(encoding="utf-8")
          block = """
              release {
                  storeFile file('haoxiansuo-ci.keystore')
                  storePassword 'haoxiansuo'
                  keyAlias 'haoxiansuo'
                  keyPassword 'haoxiansuo'
              }
          """
          if "haoxiansuo-ci.keystore" not in text:
              text = text.replace(
                  "signingConfigs {",
                  "signingConfigs {\n" + block,
                  1,
              )
              # Prefer release keystore for release builds when template still points at debug.
              text = text.replace(
                  "signingConfig signingConfigs.debug",
                  "signingConfig signingConfigs.release",
              )
              path.write_text(text, encoding="utf-8")
          print("signing config ready")
          PY

      - name: Gradle assemble
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          if [ "${{ steps.variant.outputs.name }}" = "debug" ]; then
            ./gradlew assembleDebug --no-daemon
          else
            ./gradlew assembleRelease --no-daemon
          fi

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          VARIANT="${{ steps.variant.outputs.name }}"
          if [ "$VARIANT" = "debug" ]; then
            APK=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          else
            APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          fi
          if [ -z "$APK" ]; then
            echo "APK not found"
            find android/app/build/outputs -type f -name "*.apk" || true
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          cp "$APK" "haoxiansuo-1.0.0-${VARIANT}.apk"
          echo "Copied to haoxiansuo-1.0.0-${VARIANT}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: haoxiansuo-apk-${{ steps.variant.outputs.name }}
          path: mobile/haoxiansuo-1.0.0-${{ steps.variant.outputs.name }}.apk
          if-no-files-found: error

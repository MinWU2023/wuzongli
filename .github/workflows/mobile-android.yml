name: Mobile Android APK

# 不使用 Expo EAS。Runner 上 prebuild + Gradle 打 APK。
# - 普通推送 / 手动：上传到 Actions Artifacts
# - 打 v* 标签：额外创建/更新 GitHub Release，并把 APK 挂到 Assets

on:
  workflow_dispatch:
    inputs:
      variant:
        description: APK variant
        required: true
        default: release
        type: choice
        options:
          - release
          - debug
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master

permissions:
  contents: write

concurrency:
  group: mobile-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve variant
        id: variant
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.variant }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=release" >> "$GITHUB_OUTPUT"
          fi
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=1.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          {
            echo "$SDK_ROOT/cmdline-tools/latest/bin"
            echo "$SDK_ROOT/platform-tools"
            echo "$SDK_ROOT/emulator"
          } >> "$GITHUB_PATH"
          SDKMANAGER=""
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT"
            ls -la "$SDK_ROOT" || true
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install JS dependencies
        env:
          # 避免 NODE_ENV=production 跳过打包所需依赖
          NODE_ENV: development
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          test -d node_modules/expo-asset
          test -f metro.config.js
          npx @react-native-community/cli --version

      - name: Prebuild native Android project
        run: npx expo prebuild --platform android --non-interactive

      # 体积：默认 universal APK 含 4 种 ABI，原生库会到 100MB+；只留手机 arm64 + 开启压缩
      - name: Slim Android release build
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          props = Path("android/gradle.properties")
          text = props.read_text(encoding="utf-8") if props.exists() else ""
          lines = []
          for line in text.splitlines():
              if line.startswith("reactNativeArchitectures="):
                  continue
              if line.startswith("android.enableMinifyInReleaseBuilds="):
                  continue
              if line.startswith("android.enableShrinkResourcesInReleaseBuilds="):
                  continue
              lines.append(line)
          lines += [
              "reactNativeArchitectures=arm64-v8a",
              # 先关 R8，避免 RN/Expo release 被错误裁剪；体积主要靠单 ABI
              "android.enableMinifyInReleaseBuilds=false",
              "android.enableShrinkResourcesInReleaseBuilds=false",
          ]
          props.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("gradle.properties: arm64-v8a + minify/shrink")

          app_gradle = Path("android/app/build.gradle")
          g = app_gradle.read_text(encoding="utf-8")

          # 只打 arm64，避免 x86/x86_64/armeabi 一起打进一个包
          if "abiFilters" not in g:
              g, n = re.subn(
                  r"(defaultConfig\s*\{)",
                  r'\1\n        ndk {\n            abiFilters "arm64-v8a"\n        }',
                  g,
                  count=1,
              )
              print(f"abiFilters patched={n}")

          # release 用 debug 签名（内测）；并打开 minify/shrink
          g2, n = re.subn(
              r"(buildTypes\s*\{[\s\S]*?release\s*\{[\s\S]*?)signingConfig\s+[^\n]+",
              r"\1signingConfig signingConfigs.debug",
              g,
              count=1,
          )
          if n == 0:
              g2, n = re.subn(
                  r"(buildTypes\s*\{[\s\S]*?release\s*\{)",
                  r"\1\n            signingConfig signingConfigs.debug",
                  g,
                  count=1,
              )
          if n == 0:
              raise SystemExit("cannot patch release signingConfig")
          g = g2

          g = re.sub(r"minifyEnabled\s+true", "minifyEnabled false", g)
          g = re.sub(r"shrinkResources\s+true", "shrinkResources false", g)
          if "minifyEnabled" not in g.split("release {", 1)[-1][:800]:
              g, n = re.subn(
                  r"(buildTypes\s*\{[\s\S]*?release\s*\{)",
                  r"\1\n            minifyEnabled false\n            shrinkResources false",
                  g,
                  count=1,
              )
              print(f"minify disabled patched={n}")

          app_gradle.write_text(g, encoding="utf-8")
          print("app/build.gradle slimmed")
          PY

      # 由 Expo/RN Gradle 在 assembleRelease 时打包 JS（需 metro.config.js + expo-asset）
      - name: Gradle assemble
        working-directory: mobile/android
        env:
          NODE_ENV: production
          EXPO_NO_TELEMETRY: 1
        run: |
          chmod +x gradlew
          if [ "${{ steps.variant.outputs.name }}" = "release" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          VARIANT="${{ steps.variant.outputs.name }}"
          VERSION="${{ steps.variant.outputs.version }}"
          if [ "$VARIANT" = "release" ]; then
            APK=$(find android/app/build/outputs/apk/release -type f -name "*.apk" ! -name "*-unsigned.apk" ! -name "*.apk.idsig" | head -n 1)
          else
            APK=$(find android/app/build/outputs/apk/debug -type f -name "*.apk" ! -name "*.apk.idsig" | head -n 1)
          fi
          if [ -z "$APK" ]; then
            echo "APK not found for variant=$VARIANT"
            find android/app/build/outputs -type f -name "*.apk" || true
            exit 1
          fi
          # 二次确认：release 包里应带有 index.android.bundle
          if [ "$VARIANT" = "release" ]; then
            unzip -l "$APK" | grep -E 'index\.android\.bundle|assets/index' || {
              echo "Release APK missing JS bundle — refusing to publish"
              exit 1
            }
          fi
          OUT="haoxiansuo-${VERSION}-${VARIANT}.apk"
          cp "$APK" "$OUT"
          echo "found=$APK"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: haoxiansuo-apk-${{ steps.variant.outputs.version }}-${{ steps.variant.outputs.name }}
          path: mobile/${{ steps.apk.outputs.file }}
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 好线索 ${{ github.ref_name }}
          body: |
            好线索 ${{ github.ref_name }}

            下载下方 APK 安装。若只有源码压缩包，说明构建未成功，请到 Actions 查看日志。
          files: mobile/${{ steps.apk.outputs.file }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Mobile Android APK

# 不使用 Expo EAS。Runner 上 prebuild + Gradle 打 APK。
# - 普通推送 / 手动：上传到 Actions Artifacts
# - 打 v* 标签：额外创建/更新 GitHub Release，并把 APK 挂到 Assets

on:
  workflow_dispatch:
    inputs:
      variant:
        description: APK variant
        required: true
        default: release
        type: choice
        options:
          - release
          - debug
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master

permissions:
  contents: write

concurrency:
  group: mobile-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve variant
        id: variant
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.variant }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=release" >> "$GITHUB_OUTPUT"
          fi
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=1.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          {
            echo "$SDK_ROOT/cmdline-tools/latest/bin"
            echo "$SDK_ROOT/platform-tools"
            echo "$SDK_ROOT/emulator"
          } >> "$GITHUB_PATH"
          SDKMANAGER=""
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT"
            ls -la "$SDK_ROOT" || true
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install JS dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Prebuild native Android project
        run: npx expo prebuild --platform android --non-interactive

      # release 用 debug 签名即可内测安装；禁止回退 assembleDebug（debug 不含 JS bundle，手机必红屏）
      - name: Ensure release signing works
        if: steps.variant.outputs.name == 'release'
        working-directory: mobile/android/app
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path("build.gradle")
          text = path.read_text(encoding="utf-8")
          # Expo 模板常见：release 未配置签名会失败；强制指向 debug 签名
          if "signingConfigs.release" not in text and "storeFile" not in text.split("release {", 1)[-1][:400]:
              pass
          # 无论模板如何，保证 release buildType 使用 debug 签名配置
          import re
          text2, n = re.subn(
              r"(buildTypes\s*\{[\s\S]*?release\s*\{[\s\S]*?)signingConfig\s+[^\n]+",
              r"\1signingConfig signingConfigs.debug",
              text,
              count=1,
          )
          if n == 0:
              text2, n = re.subn(
                  r"(buildTypes\s*\{[\s\S]*?release\s*\{)",
                  r"\1\n            signingConfig signingConfigs.debug",
                  text,
                  count=1,
              )
          if n == 0:
              raise SystemExit("cannot patch release signingConfig in app/build.gradle")
          path.write_text(text2, encoding="utf-8")
          print("release signingConfig -> debug")
          PY

      - name: Bundle JS into Android assets
        if: steps.variant.outputs.name == 'release'
        run: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle \
            --platform android \
            --dev false \
            --minify true \
            --entry-file node_modules/expo/AppEntry.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res
          test -s android/app/src/main/assets/index.android.bundle

      - name: Gradle assemble
        working-directory: mobile/android
        env:
          NODE_ENV: production
        run: |
          chmod +x gradlew
          if [ "${{ steps.variant.outputs.name }}" = "release" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          VARIANT="${{ steps.variant.outputs.name }}"
          VERSION="${{ steps.variant.outputs.version }}"
          if [ "$VARIANT" = "release" ]; then
            APK=$(find android/app/build/outputs/apk/release -type f -name "*.apk" ! -name "*-unsigned.apk" ! -name "*.apk.idsig" | head -n 1)
          else
            APK=$(find android/app/build/outputs/apk/debug -type f -name "*.apk" ! -name "*.apk.idsig" | head -n 1)
          fi
          if [ -z "$APK" ]; then
            echo "APK not found for variant=$VARIANT"
            find android/app/build/outputs -type f -name "*.apk" || true
            exit 1
          fi
          # 二次确认：release 包里应带有 index.android.bundle
          if [ "$VARIANT" = "release" ]; then
            unzip -l "$APK" | grep -E 'index\.android\.bundle|assets/index' || {
              echo "Release APK missing JS bundle — refusing to publish"
              exit 1
            }
          fi
          OUT="haoxiansuo-${VERSION}-${VARIANT}.apk"
          cp "$APK" "$OUT"
          echo "found=$APK"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: haoxiansuo-apk-${{ steps.variant.outputs.version }}-${{ steps.variant.outputs.name }}
          path: mobile/${{ steps.apk.outputs.file }}
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 好线索 ${{ github.ref_name }}
          body: |
            好线索 ${{ github.ref_name }}

            下载下方 APK 安装。若只有源码压缩包，说明构建未成功，请到 Actions 查看日志。
          files: mobile/${{ steps.apk.outputs.file }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
